league_id: 492312
team_id: 7  # WARNING: must match your actual Yahoo team ID. Wrong-but-valid IDs silently analyze a different team with no error. Verify against Yahoo directly if changing.

# team_name is derived from team_id at runtime via the scraped df
# (no need to maintain it here — removing to avoid desync)
positions: "QB, WR, WR, RB, RB, TE, W/R, K, DEF, BN, BN, BN, BN, BN, BN, IR"
is_idp: false
scoring_type: "half-ppr"   # confirmed: league gives 0.5 pts per reception
waiver_type: "continual_rolling"   # confirmed from league settings — not FAAB
waiver_priority: 10   # update weekly as it changes
season: 2026

# Optional weekly matchup schedule: week number -> opponent Yahoo team ID.
schedule: {}

# Player scoring SD defaults, used until a player has 3 completed games.
position_sd:
  default: 8.0
  QB: 6.0
  RB: 7.0
  WR: 8.0
  TE: 6.0
  K: 4.0
  DEF: 7.0
# Analytics-only pooled walk-forward blend residual SD priors; engine position_sd is unchanged.
forecast_error_sd_prior:
  default: 8.0
  QB: 8.067
  RB: 5.484
  WR: 5.158
  TE: 4.038
  K: 4.690
  DEF: 5.320
win_probability_thresholds:
  favorite: 0.60
  underdog: 0.40
matchup_z: 0.5
lineup_swap_margin: 1.0
matchup_ros_weight: 0.002

# Snapshot/analytics flags. Keep the forecast model advisory unless opted in.
kickoff_times:
  1: "2026-09-09T20:20:00-04:00"
  2: "2026-09-17T20:15:00-04:00"
  3: "2026-09-24T20:15:00-04:00"
  4: "2026-10-01T20:15:00-04:00"
  5: "2026-10-08T20:15:00-04:00"
  6: "2026-10-15T20:15:00-04:00"
  7: "2026-10-22T20:15:00-04:00"
  8: "2026-10-29T20:15:00-04:00"
  9: "2026-11-05T20:15:00-05:00"
  10: "2026-11-12T20:15:00-05:00"
  11: "2026-11-19T20:15:00-05:00"
  12: "2026-11-25T20:00:00-05:00"
  13: "2026-12-03T20:15:00-05:00"
  14: "2026-12-10T20:15:00-05:00"
  15: "2026-12-17T20:15:00-05:00"
  16: "2026-12-24T20:15:00-05:00"
  17: "2026-12-31T20:15:00-05:00"
use_model_sd: false
use_model_projections: false
model_projection_min_mae_improvement: 0.25
model_projection_min_weeks: 6

# thresholds the decision engine uses — tune over time
min_vor_gain_to_recommend_add:
  QB: 2.0
  TE: 2.0
  K: 1.0
  DEF: 1.0
  RB: 8.0
  WR: 8.0
min_usable_projection: 1.0
worst_vor_drop_note_threshold: 3.0  # VOR gap threshold for transparency note when ffbot's drop is not the worst-VOR bench player
bench_depth_minimums:
  RB: 1
  WR: 1
  QB: 1
  TE: 0

# positions where no add/drop recommendations will be generated
# (e.g., locking DEF because you're streaming weekly matchups)
locked_positions: []

# Positions where current-week streaming can outweigh long-term roster value.
streaming_positions: [K, DEF]

# Optional independent second opinion. Disabled unless explicitly enabled here
# or with --llm-evaluate; it never executes transactions or changes lineups.
llm_evaluator:
  enabled: false
  provider: "openai-compatible"
  model: ""
  endpoint: "https://api.openai.com/v1/chat/completions"
  api_key_env: "OPENAI_API_KEY"
  timeout_seconds: 60

reasoning_engine:
  # Evaluate every proposed add/drop against the optimized lineup and roster
  # state. This is deterministic and advisory; it does not execute moves.
  enabled: true

# injury statuses that prevent a player from being used as bench depth
# (true IR-slot eligibility only — "O" is a game-day designation, not IR)
ir_statuses:
  - "IR"
  - "IR-R"
  - "NFI"
  - "NFI-R"
  - "NFI-A"
  - "COVID"
  - "PUP"
  - "PUP-R"
